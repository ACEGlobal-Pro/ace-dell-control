# Release builds only. All other building and testing is done locally.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read   # SignPath reads the uploaded artifact
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload unsigned build for signing
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ace-dell-control-unsigned
          path: build/out

      - name: Request code signing from SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ace-dell-control
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed

      - name: Upload signed build
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ace-dell-control-signed
          path: build/signed
